<svg viewBox="0 0 760 720" xmlns="http://www.w3.org/2000/svg" font-family="'Inter', -apple-system, 'Segoe UI', Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="760" height="720" fill="#fafafa"/>

  <!-- Title -->
  <text x="380" y="56" text-anchor="middle" font-size="22" font-weight="700" fill="#18181b" letter-spacing="-0.4">GameStore API</text>
  <text x="380" y="80" text-anchor="middle" font-size="13" fill="#71717a" letter-spacing="0.2">Spring Boot · Java 21 · PostgreSQL</text>

  <!-- ============ CLIENT ============ -->
  <g filter="url(#shadow)">
    <rect x="280" y="120" width="200" height="56" rx="10" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>
  </g>
  <circle cx="310" cy="148" r="4" fill="#a1a1aa"/>
  <text x="380" y="153" text-anchor="middle" font-size="14" font-weight="600" fill="#27272a">Client</text>

  <!-- Arrow -->
  <line x1="380" y1="180" x2="380" y2="208" stroke="#d4d4d8" stroke-width="1.5"/>
  <polygon points="375,206 385,206 380,216" fill="#d4d4d8"/>

  <!-- ============ SECURITY ============ -->
  <g filter="url(#shadow)">
    <rect x="160" y="222" width="440" height="64" rx="10" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>
  </g>
  <!-- left accent bar -->
  <rect x="160" y="222" width="4" height="64" rx="2" fill="#6366f1"/>
  <!-- icon: shield -->
  <g transform="translate(190, 240)">
    <path d="M12 2 L20 5 L20 13 C20 18 16 22 12 24 C8 22 4 18 4 13 L4 5 Z" fill="none" stroke="#6366f1" stroke-width="1.8" stroke-linejoin="round"/>
  </g>
  <text x="230" y="252" font-size="11" font-weight="600" fill="#6366f1" letter-spacing="1.3">SECURITY</text>
  <text x="230" y="272" font-size="14" font-weight="600" fill="#18181b">JWT · Rate limiting · Roles</text>

  <line x1="380" y1="286" x2="380" y2="314" stroke="#d4d4d8" stroke-width="1.5"/>
  <polygon points="375,312 385,312 380,322" fill="#d4d4d8"/>

  <!-- ============ CONTROLLERS ============ -->
  <g filter="url(#shadow)">
    <rect x="160" y="328" width="440" height="64" rx="10" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>
  </g>
  <rect x="160" y="328" width="4" height="64" rx="2" fill="#0ea5e9"/>
  <!-- icon: api/arrows -->
  <g transform="translate(190, 346)">
    <path d="M3 12 L21 12 M14 5 L21 12 L14 19" fill="none" stroke="#0ea5e9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="230" y="358" font-size="11" font-weight="600" fill="#0ea5e9" letter-spacing="1.3">CONTROLLERS</text>
  <text x="230" y="378" font-size="14" font-weight="600" fill="#18181b">REST endpoints · DTOs</text>

  <line x1="380" y1="392" x2="380" y2="420" stroke="#d4d4d8" stroke-width="1.5"/>
  <polygon points="375,418 385,418 380,428" fill="#d4d4d8"/>

  <!-- ============ SERVICES ============ -->
  <g filter="url(#shadow)">
    <rect x="160" y="434" width="440" height="64" rx="10" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>
  </g>
  <rect x="160" y="434" width="4" height="64" rx="2" fill="#10b981"/>
  <!-- icon: gear -->
  <g transform="translate(190, 452)">
    <circle cx="12" cy="12" r="3" fill="none" stroke="#10b981" stroke-width="1.8"/>
    <path d="M12 2 L12 5 M12 19 L12 22 M2 12 L5 12 M19 12 L22 12 M5 5 L7 7 M17 17 L19 19 M5 19 L7 17 M17 7 L19 5" stroke="#10b981" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <text x="230" y="464" font-size="11" font-weight="600" fill="#10b981" letter-spacing="1.3">SERVICES</text>
  <text x="230" y="484" font-size="14" font-weight="600" fill="#18181b">Lógica de negocio · @Transactional</text>

  <!-- Kafka connector -->
  <line x1="600" y1="466" x2="640" y2="466" stroke="#d4d4d8" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Kafka side box -->
  <g filter="url(#shadow)">
    <rect x="640" y="442" width="100" height="48" rx="10" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>
  </g>
  <rect x="640" y="442" width="4" height="48" rx="2" fill="#f59e0b"/>
  <text x="694" y="462" text-anchor="middle" font-size="10" font-weight="600" fill="#f59e0b" letter-spacing="1.3">KAFKA</text>
  <text x="694" y="478" text-anchor="middle" font-size="11" fill="#52525b">eventos</text>

  <line x1="380" y1="498" x2="380" y2="526" stroke="#d4d4d8" stroke-width="1.5"/>
  <polygon points="375,524 385,524 380,534" fill="#d4d4d8"/>

  <!-- ============ REPOSITORIES ============ -->
  <g filter="url(#shadow)">
    <rect x="160" y="540" width="440" height="64" rx="10" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>
  </g>
  <rect x="160" y="540" width="4" height="64" rx="2" fill="#f97316"/>
  <!-- icon: database stack -->
  <g transform="translate(190, 558)">
    <ellipse cx="12" cy="5" rx="8" ry="3" fill="none" stroke="#f97316" stroke-width="1.8"/>
    <path d="M4 5 L4 19 C4 21 8 22 12 22 C16 22 20 21 20 19 L20 5" fill="none" stroke="#f97316" stroke-width="1.8"/>
    <path d="M4 12 C4 14 8 15 12 15 C16 15 20 14 20 12" fill="none" stroke="#f97316" stroke-width="1.8"/>
  </g>
  <text x="230" y="570" font-size="11" font-weight="600" fill="#f97316" letter-spacing="1.3">REPOSITORIES</text>
  <text x="230" y="590" font-size="14" font-weight="600" fill="#18181b">Spring Data JPA</text>

  <line x1="380" y1="604" x2="380" y2="632" stroke="#d4d4d8" stroke-width="1.5"/>
  <polygon points="375,630 385,630 380,640" fill="#d4d4d8"/>

  <!-- ============ DATABASE ============ -->
  <g filter="url(#shadow)">
    <rect x="280" y="646" width="200" height="48" rx="10" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>
  </g>
  <rect x="280" y="646" width="4" height="48" rx="2" fill="#3b82f6"/>
  <text x="380" y="672" text-anchor="middle" font-size="14" font-weight="600" fill="#18181b">PostgreSQL</text>
  <text x="380" y="686" text-anchor="middle" font-size="11" fill="#71717a">Flyway · HikariCP</text>

</svg>
